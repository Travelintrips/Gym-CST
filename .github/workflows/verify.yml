name: Gym CST CI
on:
  push:
    branches: [dev, erp]
  pull_request:
    branches: [erp]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          node --check server.js
          node --check app.js
          node --check smoke-test.mjs
      - name: Run smoke tests
        run: npm test
